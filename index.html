<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>専売所HP モック比較</title>
<style>
  :root { --bg:#f4f5f7; --ink:#1b2430; --sub:#5b6573; --line:#d9dde3; --accent:#e8742a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans JP",system-ui,sans-serif; }
  header { padding:14px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:16px; margin:0 12px 0 0; }
  .seg button { border:1px solid var(--line); background:#fff; padding:6px 12px; font-size:13px; cursor:pointer; }
  .seg button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .seg button:first-child { border-radius:6px 0 0 6px; } .seg button:last-child { border-radius:0 6px 6px 0; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card h2 { font-size:15px; margin:0; padding:10px 12px 2px; }
  .card p { font-size:12px; color:var(--sub); margin:0; padding:0 12px 10px; }
  .card a { font-size:12px; color:var(--accent); padding:0 12px 10px; }
  .frame { position:relative; overflow:hidden; border-top:1px solid var(--line); height:78vh; }
  .frame iframe { border:0; transform-origin:0 0; position:absolute; top:0; left:0; }
  @media (max-width:900px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>専売所HP トップページ 3案比較</h1>
  <div class="seg" id="seg">
    <button data-w="1366" class="on">パソコン幅</button><button data-w="375">スマホ幅</button>
  </div>
</header>
<div class="grid">
  <div class="card"><h2>案1 正統派（松本専売所型）</h2><p>写真大きめ・明朝のキャッチ・生成り背景。安心感と温かさ優先</p><a href="mockup/案1_正統派/index.html" target="_blank">単独で開く ↗</a><div class="frame"><iframe src="mockup/案1_正統派/index.html"></iframe></div></div>
  <div class="card"><h2>案2 物流ベンチャー型</h2><p>黒・紺＋オレンジ・配達網の図解が主役。新聞屋っぽさを一番消す</p><a href="mockup/案2_物流ベンチャー/index.html" target="_blank">単独で開く ↗</a><div class="frame"><iframe src="mockup/案2_物流ベンチャー/index.html"></iframe></div></div>
  <div class="card"><h2>NEW：スクロールで会社の中を巡る 3D版（試作）</h2><p>案3の最初の画面から、3Dの会社の中（新聞・折込／宅配・物流／まごころ／AI）を順に巡ります。読み込みに少し時間がかかります（約20MB）</p><a href="3D試作/A_本格3D/index.html" target="_blank">単独で開く ↗</a></div>
  <div class="card"><h2>案3 攻め型</h2><p>黒地に特大コピー・人物が主役・オレンジの数字帯。勢い重視</p><a href="mockup/案3_攻め/index.html" target="_blank">単独で開く ↗</a><div class="frame"><iframe src="mockup/案3_攻め/index.html"></iframe></div></div>
</div>
<script>
  let W = 1366;
  function fit(){
    document.querySelectorAll('.frame').forEach(f=>{
      const ifr=f.querySelector('iframe'); const s=f.clientWidth/W;
      ifr.style.width=W+'px'; ifr.style.height=(f.clientHeight/s)+'px'; ifr.style.transform='scale('+s+')';
    });
  }
  document.getElementById('seg').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
    W=+b.dataset.w; fit();
  });
  addEventListener('resize',fit); fit();
</script>
</body>
</html>
