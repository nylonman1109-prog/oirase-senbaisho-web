<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A 本格3D｜おいらせ専売所 試作</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_common/ui.css">
<style>
  .stage canvas{display:block;width:100%;height:100%}
  .err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:14px;opacity:.8}
  /* 3D素材のクレジット（CC-BY の作者名表記） */
  .credit-btn{position:fixed;right:10px;bottom:8px;z-index:12;font-size:10px;color:rgba(255,255,255,.55);background:none;border:0;cursor:pointer;text-decoration:underline}
  .credit-box{position:fixed;right:10px;bottom:30px;z-index:12;max-width:min(420px,calc(100% - 20px));max-height:50vh;overflow:auto;background:rgba(10,14,23,.94);
    border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 14px;font-size:11px;line-height:1.7;display:none}
  .credit-box.on{display:block}
  .credit-box a{color:#F4903C}
  @media (max-width:760px){ .credit-btn{bottom:auto;top:62px} .credit-box{bottom:auto;top:84px} }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div class="stage" id="stage"></div>
<button class="credit-btn" id="creditBtn">3D素材のクレジット</button>
<div class="credit-box" id="creditBox"></div>

<script type="module">
// A：本物の3D空間を、スクロールに合わせてカメラが移動する。
// 建物は ./building.js（いまは仮の箱。Codexが本番版に作り直す）
import * as THREE from 'three';
import { SCENES, STAFF, boardLayout, setupScroll, lerp, dwell, openPhoto, openImage } from '../_common/scenes.js';
import { createBuilding } from './building.js';
import { loadRooms, shown, CREDITS } from './rooms.js';

const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  stage.innerHTML = '<p class="err">この端末では3D表示ができませんでした。</p>'; throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// 夜明けの空（上=紺 → 地平線=オレンジ）
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: new THREE.Color(0x0B2545) }, mid: { value: new THREE.Color(0x5b6f9a) }, low: { value: new THREE.Color(0xF4A35C) } },
  vertexShader: 'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 low; varying vec3 p; void main(){ float h = normalize(p).y; vec3 c = h > .15 ? mix(mid, top, smoothstep(.15,.6,h)) : mix(low, mid, smoothstep(-.02,.15,h)); gl_FragColor = vec4(c,1.); }'
}));
scene.add(sky);
scene.fog = new THREE.Fog(0x8a8fa8, 60, 180);

scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x5a4a3a, 1.1));
const sun = new THREE.DirectionalLight(0xffc48a, 2.2);
sun.position.set(40, 22, -30); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 120 });
scene.add(sun);
const inside = new THREE.PointLight(0xfff1dc, 18, 30); inside.position.set(0, 5.5, 1); scene.add(inside);
const inside1 = new THREE.PointLight(0xfff1dc, 14, 26); inside1.position.set(0, 2.4, 1); scene.add(inside1);

const { group, anchors, update, clickables = [], panelSpots } = createBuilding(THREE, { board: boardLayout() });
scene.add(group);

// ---- 3Dの人は出さない（人はスタッフの等身大パネルで見せる） ----
group.traverse(o => { if (/worker|staff|person/i.test(o.name)) o.visible = false; });
// 窓の外の町並みの板は、部屋の中にいる場面だけ見せる（外から見ると空に浮いて見えるため）
const towns = []; group.traverse(o => { if (o.name === 'window-town') towns.push(o); });
const INDOOR = ['orikomi', 'garage', 'magokoro', 'board', 'ai'];

// ---- おいらせ店メンバーの等身大パネル ----
// 立てる場所：建物側が panelSpots を返せばそれを使う。無ければここの仮の位置（床の上の足元の位置）
const SPOTS = panelSpots || {
  orikomi:  [[-5.95, .2, .35]],      // 作業台の手前（元は作業する人がいた所）
  garage:   [[6.1, .2, 1.3]],         // 軽バンの運転席側の手前（PCでは左に文面カードが出るので右寄せ）
  magokoro: [[-1.65, 3.5, -3.6]],    // コルクボードの右横
  ai:       [[6.3, 3.5, -2.0]],      // 机の横（座っている位置だとモニターを隠すので）
};
const panels = [];
const placeholderTex = (() => {          // 写真が届くまでの「写真待ち」パネル（人のシルエット）
  const c = document.createElement('canvas'); c.width = 256; c.height = 560;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(255,255,255,.92)'; x.beginPath(); x.roundRect(8, 8, 240, 544, 28); x.fill();
  x.fillStyle = '#0B2545'; x.beginPath(); x.arc(128, 120, 54, 0, 7); x.fill();
  x.beginPath(); x.roundRect(52, 190, 152, 300, 60); x.fill();
  x.fillStyle = '#F4903C'; x.font = 'bold 30px sans-serif'; x.textAlign = 'center'; x.fillText('写真待ち', 128, 532);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const loader = new THREE.TextureLoader();
for (const st of STAFF) {
  const spot = (SPOTS[st.scene] || [])[STAFF.filter(s => s.scene === st.scene).indexOf(st)];
  if (!spot) continue;
  const H = 1.72, W = .78;                                   // 等身大（高さ1.72m）
  const mat = new THREE.MeshBasicMaterial({ map: placeholderTex, transparent: true, alphaTest: .05, side: THREE.DoubleSide });
  const panel = new THREE.Group(); panel.position.set(...spot);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(W, H), mat); face.position.y = H / 2 + .06; panel.add(face);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(.5, .06, .3), new THREE.MeshStandardMaterial({ color: 0xF4903C })); foot.position.y = .03; panel.add(foot);
  if (st.src) loader.load(st.src, t => {                      // 写真が来たら、縦横比に合わせて差し替える
    t.colorSpace = THREE.SRGBColorSpace; mat.map = t; mat.needsUpdate = true;
    face.scale.x = (t.image.width / t.image.height) * H / W;
  });
  face.userData.staff = st; panel.userData.scene = st.scene;
  scene.add(panel); panels.push(panel); clickables.push(face);
}
const camera = new THREE.PerspectiveCamera(50, 1, .1, 1000);
const key = SCENES.map(s => anchors[s.id]);
// カメラの位置を画面に合わせて整える。
// fill:[幅,高さ] があるアンカー（コルクボード）は、その面が画面いっぱいに映る距離まで寄る
function pose(a) {
  const sp = innerWidth < 760;
  if (a.fill) {
    const [w, h] = a.fill, tan = Math.tan(fovOf(a) * Math.PI / 360), asp = innerWidth / innerHeight;
    const dH = h / 2 / tan, dW = w / 2 / (tan * asp);
    const d = sp ? dW * .78 : Math.max(dH, dW) * .96;  // PCはボード全体が収まるぎりぎり、スマホは横を少し切って大きく
    const n = a.normal || [0, 0, 1];                    // ボードの向き（正面の方向）にカメラを引く
    return { pos: a.look.map((v, k) => v + n[k] * d), look: a.look };
  }
  if (!sp) return a;
  return { pos: [a.pos[0], a.pos[1], a.pos[2] + 1.6], look: [a.look[0], a.look[1] - .5, a.look[2]] }; // スマホは一歩引いて目線を下げる
}
const target = { pos: new THREE.Vector3(...key[0].pos), look: new THREE.Vector3(...key[0].look), fov: 50 };
const now = { pos: target.pos.clone(), look: target.look.clone(), fov: 50 };
// 場面ごとの画角：アンカーに fov（縦の画角・度）があればそれを使う。スマホは少し広角に
const fovOf = a => (a.fov || 50) + (innerWidth < 760 ? 12 : 0);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = now.fov;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

setupScroll({
  label: 'A 本格3D',
  onProgress(p) {
    const i = Math.min(key.length - 2, Math.floor(p)), t = dwell(p - i);
    const inside = INDOOR.includes(SCENES[Math.min(SCENES.length - 1, Math.round(p))].id);
    towns.forEach(o => o.visible = inside);
    const a = pose(key[i]), b = pose(key[i + 1]);
    target.pos.set(...a.pos.map((v, k) => lerp(v, b.pos[k], t)));
    target.look.set(...a.look.map((v, k) => lerp(v, b.look[k], t)));
    target.fov = lerp(fovOf(key[i]), fovOf(key[i + 1]), t);
    // 部屋と部屋の間を移動するときは、少し手前に引いてから入る（壁抜けを目立たせない）。ボードへ寄るときは引かない
    const close = key[i].fill || key[i + 1].fill;
    target.pos.z += Math.sin(t * Math.PI) * (i === 0 || close ? 0 : 1.6);
  }
});

// コルクボードの写真をクリック（タップ）すると大きく見られる
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const hit = e => {
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(clickables.filter(shown))[0];
};
addEventListener('click', e => {
  if (e.target.closest('.x-card,.x-hd,.x-dots,.x-lb,.x-hero')) return;
  const h = hit(e); if (!h) return;
  const st = h.object.userData.staff;
  if (st) { if (st.src) openImage(st.src, [st.name, st.role].filter(Boolean).join('／')); }
  else openPhoto(h.object.userData.photo);
});
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') document.body.style.cursor = hit(e) ? 'zoom-in' : ''; });

// 焼き付けた部屋を順に読み込み、建物の各部屋にはめ込む（読み込み中は簡単な部屋のまま）
loadRooms({ THREE, renderer, scene, group, anchors, panels, clickables, boardLayout, onRoom: () => dispatchEvent(new Event('scroll')) });
const creditBox = document.getElementById('creditBox');
document.getElementById('creditBtn').onclick = () => {
  creditBox.innerHTML = '<b>3Dモデル（CC BY 4.0）</b><br>' + [...CREDITS.values()].map(c => `「${c.title}」 ${c.author} / <a href="${c.url}" target="_blank" rel="noopener">Sketchfab</a>`).join('<br>')
    + '<br><br>質感・環境光・一部の小物：Poly Haven、ambientCG（CC0）<br>※一部のモデルは大きさ・色・形を調整し、ロゴや文字を消しています。';
  creditBox.classList.toggle('on');
};

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const k = matchMedia('(prefers-reduced-motion: reduce)').matches || location.search.includes('instant') ? 1 : .08; // ?instant＝確認用（カメラが一瞬で移る）
  now.pos.lerp(target.pos, k); now.look.lerp(target.look, k);
  camera.position.copy(now.pos); camera.lookAt(now.look);
  now.fov += (target.fov - now.fov) * k;
  if (Math.abs(camera.fov - now.fov) > .01) { camera.fov = now.fov; camera.updateProjectionMatrix(); }
  update?.(clock.getElapsedTime());
  for (const p of panels) p.rotation.y = Math.atan2(camera.position.x - p.position.x, camera.position.z - p.position.z);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
